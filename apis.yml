description: 'Lower is a U.S. direct-to-consumer mortgage lender and servicer (Lower, LLC,
  NMLS #1124061) offering home purchase loans, refinancing, and home equity products
  including conventional, FHA, VA, jumbo, and adjustable-rate mortgages, HELOCs, and
  cash-out options. Lower operates a mobile-first application experience with dedicated
  loan officers and conducts business in 47 states plus the District of Columbia. It was
  surfaced as a portfolio company of Accel and added to the API Evangelist network. Lower
  publishes no public developer portal, API documentation, or machine-readable API
  surface at this time; this profile captures its public web, legal, and domain-security
  posture.'
